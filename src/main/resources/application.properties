server.port=9090
library.ts4300.ip=***IP***
library.ts4300.user=***ELIMINADO***
library.ts4300.password=***ELIMINADO***

# ==========================================
# CONEXIÓN A LA BASE DE DATOS POSTGRESQL
# ==========================================
# Cambia "atopa" por el nombre de tu base de datos si es diferente
spring.datasource.url=jdbc:postgresql://localhost:5432/atopa
spring.datasource.username=postgres
spring.datasource.password=***ELIMINADO***
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==========================================
# Muestra las consultas SQL en la consola (útil para depurar)
spring.jpa.show-sql=true

# ¡Magia! "update" hace que Spring cree o actualice la tabla "clientes"
# automáticamente basándose en tu clase Cliente.java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect