server.port=9090

#HTTPS


server.ssl.enabled=true
server.ssl.key-store=file:C:/ltotrace/ltotrace.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=***ELIMINADO***
server.ssl.key-alias=ltotrace
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

library.ts4300.ip=***IP***
library.ts4300.user=***ELIMINADO***
library.ts4300.password=***ELIMINADO***

# ==========================================
# CONEXIÓN A LA BASE DE DATOS POSTGRESQL
# ==========================================
# Cambia "atopa" por el nombre de tu base de datos si es diferente
spring.datasource.url=jdbc:postgresql://localhost:5432/atopa
spring.datasource.username=postgres
spring.datasource.password=***ELIMINADO***
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==========================================
# Muestra las consultas SQL en la consola (útil para depurar)
spring.jpa.show-sql=true

# automáticamente basándose en tu clase Cliente.java
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect