# =====================================================================
# LTOTRACE - Configuracion de la aplicacion
# Este archivo NO contiene contrasenas. Los valores sensibles se leen de
# variables de entorno (en el servidor: /etc/ltotrace/ltotrace.env).
# Si falta una variable obligatoria, la aplicacion no inicia.
# =====================================================================
server.port=9090

# --- Base de datos PostgreSQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atopa}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ltotrace_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate: el esquema se gestiona solo con los scripts de sql/ ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# --- Clave de cifrado de las credenciales de la TS4300 y del IBM i (obligatoria) ---
lto.crypto.password=${LTO_CRYPTO_PASSWORD}

# --- HTTPS ---
server.ssl.enabled=true
server.ssl.key-store=${LTO_KEYSTORE_PATH:file:/home/ltotrace/ltotrace.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${LTO_KEYSTORE_PASSWORD}
server.ssl.key-alias=ltotrace

# --- Cookie de sesion ---
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
