<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LTOTRACE · Tecnologías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/lto.css?v=3">
    <style>
        body, html { height: 100%; overflow: hidden; font-family: 'Inter','Segoe UI',sans-serif; }
        .modulo-wrapper { padding: 1rem 1.5rem; height: 100vh; display: flex; flex-direction: column; }
        .modulo-header { flex-shrink: 0; margin-bottom: 1rem; }
        .modulo-body { flex-grow: 1; min-height: 0; display: flex; flex-direction: column; }
        .tabla-card { background:#fff; border:1px solid var(--lto-borde); border-radius:12px; box-shadow:0 2px 12px rgba(52,55,52,.05); flex-grow:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
        .tabla-scroll { overflow:auto; flex-grow:1; }
        table.tabla-config thead th { background:#f3f5ef !important; color:var(--lto-oscuro) !important; text-transform:none !important; letter-spacing:0 !important; font-weight:600; font-size:.82rem; border-bottom:1px solid var(--lto-borde) !important; padding:.8rem 1rem; }
        table.tabla-config tbody td { padding:.9rem 1rem; vertical-align:middle; border-color:#eef0ea; }
        table.tabla-config tbody tr:hover { background:rgba(112,161,189,.06); }
        .btn-accion { border:none; background:transparent; color:var(--lto-gris); padding:5px 8px; border-radius:6px; }
        .btn-accion:hover { background:var(--lto-claro); color:var(--lto-azul); }
        .btn-accion.peligro:hover { background:#fdecec; color:#c0392b; }
        .seguridad-nota { color:var(--lto-gris); font-size:.8rem; display:flex; align-items:center; gap:5px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/barra :: rail('configuracion')}"></div>

<div class="app-content">
    <div class="modulo-wrapper">

        <header class="modulo-header">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h4 class="fw-bold m-0"><i class="bi bi-hdd"></i> Tecnologías LTO</h4>
                    <div class="seguridad-nota mt-1"><i class="bi bi-info-circle"></i> Capacidades usadas para el cálculo de llenado</div>
                </div>
                <button class="btn btn-primary fw-bold" id="btnNueva">
                    <i class="bi bi-plus-lg"></i> Nueva tecnología
                </button>
            </div>
        </header>


        <div class="modulo-body">
            <div class="tabla-card">
                <div class="tabla-scroll">
                    <table class="table tabla-config mb-0">
                        <thead>
                        <tr>
                            <th>Tecnología</th>
                            <th>Generación</th>
                            <th>Capacidad nativa</th>
                            <th>Cintas en uso</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="t : ${tecnologias}">
                            <td><span class="badge bg-secondary" th:text="${t.nombre}"></span></td>
                            <td th:text="${t.generacion} ?: '—'"></td>
                            <td>
                                <span class="fw-bold" th:text="${t.capacidadGb} + ' GB'"></span>
                                <span class="text-muted small" th:text="'(' + ${#numbers.formatDecimal(t.capacidadGb / 1000.0, 1, 1)} + ' TB)'"></span>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${uso[t.nombre] > 0} ? 'bg-primary' : 'bg-light text-muted border'"
                                      th:text="${uso[t.nombre]}"></span>
                            </td>
                            <td class="text-end">
                                <button type="button" class="btn-accion btn-editar"
                                        th:data-id="${t.id}" th:data-nombre="${t.nombre}"
                                        th:data-generacion="${t.generacion}" th:data-capacidad="${t.capacidadGb}"
                                        title="Editar"><i class="bi bi-pencil"></i></button>
                                <form th:action="@{'/configuracion/tecnologias/' + ${t.id} + '/eliminar'}" method="post" class="d-inline"
                                      data-confirm="La tecnología se eliminará definitivamente. Solo es posible si ninguna cinta la utiliza." data-confirm-titulo="Eliminar tecnología" data-confirm-ok="Eliminar" data-confirm-peligro="true">
                                    <button type="submit" class="btn-accion peligro" title="Eliminar"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Modal crear/editar -->
<div class="modal fade" id="modalTec" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold" id="modalTecTitulo"><i class="bi bi-hdd"></i> Nueva tecnología</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/configuracion/tecnologias/guardar}" method="post">
                <input type="hidden" name="id" id="tecId">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Nombre</label>
                        <input type="text" name="nombre" id="tecNombre" class="form-control" placeholder="LTO-9" required>
                    </div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label fw-bold small">Generación</label>
                            <input type="number" name="generacion" id="tecGeneracion" class="form-control" placeholder="9">
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold small">Capacidad (GB nativos)</label>
                            <input type="number" name="capacidadGb" id="tecCapacidad" class="form-control" min="1" placeholder="18000" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary fw-bold">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const modal = new bootstrap.Modal(document.getElementById('modalTec'));
        const titulo = document.getElementById('modalTecTitulo');

        function limpiar() {
            document.getElementById('tecId').value = '';
            document.getElementById('tecNombre').value = '';
            document.getElementById('tecGeneracion').value = '';
            document.getElementById('tecCapacidad').value = '';
        }

        document.getElementById('btnNueva').addEventListener('click', function () {
            limpiar();
            titulo.innerHTML = '<i class="bi bi-hdd"></i> Nueva tecnología';
            modal.show();
        });

        document.addEventListener('click', function (e) {
            const btn = e.target.closest('.btn-editar');
            if (btn) {
                document.getElementById('tecId').value = btn.getAttribute('data-id');
                document.getElementById('tecNombre').value = btn.getAttribute('data-nombre');
                document.getElementById('tecGeneracion').value = btn.getAttribute('data-generacion') || '';
                document.getElementById('tecCapacidad').value = btn.getAttribute('data-capacidad');
                titulo.innerHTML = '<i class="bi bi-pencil"></i> Editar tecnología';
                modal.show();
            }
        });
    });
</script>
</body>
</html>
