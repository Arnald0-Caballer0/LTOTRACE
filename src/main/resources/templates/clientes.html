<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Atopa - Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">ATOPA</a>
    <div class="navbar-nav">
      <a class="nav-link active" href="/clientes">Gestión de Clientes</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="row">
    <div class="col-md-4">
      <div class="card shadow mb-4">
        <div class="card-header bg-primary text-white">Nuevo Cliente</div>
        <div class="card-body">
          <form action="/clientes/guardar" method="post">
            <div class="mb-3">
              <label class="form-label">Nombre de la Empresa</label>
              <input type="text" name="nombre" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Correo de Contacto</label>
              <input type="email" name="correo" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Guardar Cliente</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-dark text-white">Empresas Registradas</div>
        <div class="card-body">
          <table class="table table-striped">
            <thead>
            <tr>
              <th>ID</th>
              <th>Empresa</th>
              <th>Correo</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${clientes}">
              <td th:text="${c.id}">1</td>
              <td th:text="${c.nombre}">Cliente A</td>
              <td th:text="${c.correo}">contacto@empresa.com</td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
