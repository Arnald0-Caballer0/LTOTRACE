<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>LTOTRACE - Módulo Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root { --navbar-h: 56px; --sidebar-bg: #1a202c; --content-bg: #f4f7f9; }
    body, html { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }
    .navbar-custom { z-index: 1200; height: var(--navbar-h); }
    .layout-wrapper { display: flex; height: calc(100vh - var(--navbar-h)); margin-top: var(--navbar-h); }

    .div-izquierdo { width: 30%; background-color: var(--sidebar-bg); color: white; padding: 2rem; position: relative; display: flex; flex-direction: column; box-shadow: 4px 0 15px rgba(0,0,0,0.1); z-index: 1100; }
    .div-derecho { width: 70%; background-color: var(--content-bg); padding: 2rem; overflow-y: auto; }

    .input-cliente { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; font-size: 0.9rem; }
    .input-cliente:focus { background: rgba(255,255,255,0.1); color: white; border-color: #0d6efd; box-shadow: none; }
    .input-cliente::placeholder { color: rgba(255,255,255,0.4); }
    .btn-retroceder { position: absolute; top: 1rem; right: 1rem; }

    /* Estilos extra para las tarjetas del dashboard */
    .dash-card { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; }
    .dash-card:hover { transform: translateY(-3px); }
  </style>
  <link rel="stylesheet" href="/css/lto.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark navbar-custom fixed-top shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold px-3" href="/">LTOTRACE</a>
    <div class="navbar-nav ms-auto"><a class="nav-link px-3" href="/"><i class="bi bi-house"></i> Volver al Panel LTO</a></div>
  </div>
</nav>

<div class="layout-wrapper">
  <div class="div-izquierdo">
    <button class="btn btn-sm btn-outline-light btn-retroceder" title="Deshacer operación"><i class="bi bi-arrow-counterclockwise"></i></button>

    <div class="mb-4 mt-2">
      <label class="text-uppercase small fw-bold text-white-50 mb-1" style="letter-spacing: 1px;">Empresa / Cliente</label>
      <div class="d-flex gap-2">
        <select id="clienteSelect" class="form-select input-cliente fw-bold fs-5 text-white flex-grow-1" style="background-color: rgba(255,255,255,0.05); cursor: pointer;">
          <option value="" class="text-dark">Seleccione un Cliente</option>
          <option th:each="cliente : ${listaClientes}"
                  th:value="${cliente.id}" th:text="${cliente.nombre}"
                  th:data-encargado="${cliente.encargado}" th:data-telefono="${cliente.telefono}" th:data-correo="${cliente.email}"
                  th:data-promedio="${cliente.promedioGbBackup}" th:data-dias="${cliente.diasEntreBackups}" class="text-dark">          </option>
        </select>
        <button id="btnNuevoCliente" class="btn btn-success shadow-sm" title="Crear Nuevo Cliente"><i class="bi bi-plus-lg fw-bold"></i></button>
      </div>
    </div>

    <div class="mb-3">
      <label class="small text-white-50 mb-1"><i class="bi bi-person"></i> Encargado</label>
      <div id="datoEncargado" class="text-light fw-bold border-bottom border-secondary pb-1" style="min-height: 24px;">-</div>
    </div>
    <div class="mb-3">
      <label class="small text-white-50 mb-1"><i class="bi bi-telephone"></i> Teléfono</label>
      <div id="datoTelefono" class="text-light fw-bold border-bottom border-secondary pb-1" style="min-height: 24px;">-</div>
    </div>
    <div class="mb-4">
      <label class="small text-white-50 mb-1"><i class="bi bi-envelope"></i> Correo</label>
      <div id="datoCorreo" class="text-light fw-bold border-bottom border-secondary pb-1" style="min-height: 24px;">-</div>
    </div>

    <div class="mb-4 p-3 rounded" style="background: rgba(0,0,0,0.2);">
      <label class="fw-bold mb-2 text-info"><i class="bi bi-gear-fill"></i> Operación a realizar</label>
      <select id="operacionSelect" class="form-select bg-dark text-light border-secondary shadow-sm">
        <option value="inventario">Inventario</option>
        <option value="retiro">Retiro Cintas</option>
        <option value="datos">Datos cliente</option>
      </select>
    </div>

    <div class="flex-grow-1"></div>
    <button id="btnEntrar" class="btn btn-primary w-100 py-3 fw-bold fs-6 shadow">
      EJECUTAR OPERACIÓN <i class="bi bi-arrow-right-circle ms-2"></i>
    </button>
  </div>

  <div class="div-derecho" id="divDerechoContenido">
    <div class="h-100 d-flex flex-column justify-content-center align-items-center text-muted opacity-50">
      <i class="bi bi-layers" style="font-size: 4rem;"></i>
      <h4 class="mt-3">Seleccione una operación</h4>
      <p>Haga clic en "Ejecutar Operación" en el panel izquierdo.</p>
    </div>
  </div>
</div>

<template id="tpl-inventario">
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card lto-counter h-100">
        <div class="card-body d-flex align-items-center">
          <div class="lto-icon"><i class="bi bi-robot"></i></div>
          <div class="ms-3">
            <div class="etiqueta">Librería Robot</div>
            <div class="valor display-6">0</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card lto-counter oscuro h-100">
        <div class="card-body d-flex align-items-center">
          <div class="lto-icon"><i class="bi bi-safe"></i></div>
          <div class="ms-3">
            <div class="etiqueta">En Armario</div>
            <div class="valor display-6">0</div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card lto-counter gris h-100">
        <div class="card-body d-flex align-items-center">
          <div class="lto-icon"><i class="bi bi-disc"></i></div>
          <div class="ms-3">
            <div class="etiqueta">Vírgenes</div>
            <div class="valor display-6">0</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="zonaInventarioImprimible">
    <div class="d-flex justify-content-between align-items-end mb-3">
      <div class="d-flex align-items-center gap-3">
        <div>
          <h4 class="fw-bold text-dark mb-0">Inventario de Cintas</h4>
          <small class="text-muted">Cliente: <strong id="nombreClienteInventario" class="text-primary">Seleccione un cliente</strong></small>
        </div>
        <button id="btnPdfInventario" class="btn btn-sm btn-outline-danger shadow-sm mb-1" data-html2canvas-ignore="true" title="Exportar Inventario a PDF">
          <i class="bi bi-file-earmark-pdf-fill"></i> PDF
        </button>
      </div>

      <div style="width: 300px;" data-html2canvas-ignore="true">
        <input type="text" id="buscadorInventario" class="form-control" placeholder="Buscar cinta, barcode...">
      </div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-light">
          <tr>
            <th>Barcode</th>
            <th>Nombre (Volume ID)</th>
            <th>Tecnología</th>
            <th>Usos</th>
            <th>Estado</th>
          </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</template>

<template id="tpl-retiro">
  <div class="row h-100">
    <div class="col-md-7 d-flex flex-column h-100">
      <div class="mb-3">
        <input type="text" id="buscadorRetiro" class="form-control" placeholder="Buscar cinta para retirar...">
      </div>
      <div class="card border-0 shadow-sm flex-grow-1 overflow-auto">
        <table class="table table-hover mb-0">
          <thead class="table-light sticky-top">
          <tr>
            <th width="50">Sel.</th>
            <th>Barcode</th>
            <th>Nombre</th>
            <th>Tech</th>
          </tr>
          </thead>
          <tbody>
          <tr>
            <td><input class="form-check-input check-retiro" type="checkbox" data-barcode="CLN123L7" data-vol="TAP001"></td>
            <td>CLN123L7</td><td>TAP001</td><td>LTO-7</td>
          </tr>
          <tr>
            <td><input class="form-check-input check-retiro" type="checkbox" data-barcode="ABC456L8" data-vol="TAP002"></td>
            <td>ABC456L8</td><td>TAP002</td><td>LTO-8</td>
          </tr>
          <tr>
            <td><input class="form-check-input check-retiro" type="checkbox" data-barcode="XYZ789L8" data-vol="TAP003"></td>
            <td>XYZ789L8</td><td>TAP003</td><td>LTO-8</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="col-md-5 d-flex flex-column h-100">
      <div id="zonaActaImprimible" class="card border-0 shadow-sm flex-grow-1 mb-3 bg-white" style="padding: 20px; min-height: 500px;">
        <div class="card-body d-flex flex-column">

          <h5 class="fw-bold mb-4 text-center text-uppercase border-bottom pb-2">Acta de Retiro de Cintas</h5>

          <div class="row mb-4">
            <div class="col-12">
              <p class="mb-1 small"><strong>Empresa:</strong> <span id="actaClienteNombre" class="text-primary fw-bold">Seleccione un cliente</span></p>
              <p class="mb-1 small"><strong>Encargado:</strong> <span id="actaClienteEncargado">-</span></p>
              <p class="mb-1 small"><strong>Fecha:</strong> <span id="fechaActual"></span></p>
            </div>
          </div>

          <div class="flex-grow-1 mb-5">
            <h6 class="small fw-bold text-muted mb-3 bg-light p-2 rounded">CINTAS A RETIRAR (<span id="contadorCintas">0</span>)</h6>
            <ul id="listaCintasActa" class="list-unstyled small text-dark fw-semibold ps-2">
              <li><em class="text-muted fw-normal">Seleccione cintas en la tabla...</em></li>
            </ul>
          </div>

          <div class="mt-auto pt-5 text-center">
            <div class="border-top border-dark border-2 mx-auto mb-2" style="width: 250px;"></div>
            <p class="mb-0 fw-bold small text-uppercase">Firma de Recepción</p>
            <p class="small text-muted" id="firmaNombreEncargado">-</p>
          </div>

        </div>
      </div>

      <div class="d-flex justify-content-end mb-3">
        <button id="btnExportarPdf" class="btn btn-outline-danger btn-sm"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
      </div>

      <button id="btnProcesarRetiro" class="btn btn-warning w-100 fw-bold py-3 shadow-sm">
        <i class="bi bi-box-arrow-right"></i> PROCESAR RETIRO
      </button>
    </div>
  </div>
</template>

<template id="tpl-datos">
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white py-3">
      <h5 class="fw-bold mb-0">Ficha del Cliente</h5>
    </div>
    <div class="card-body p-4">
      <form id="formClienteBD">
        <input type="hidden" id="formDatosId">

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold small">Razón Social (Nombre)</label>
            <input type="text" id="formDatosNombre" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold small">Encargado</label>
            <input type="text" id="formDatosEncargado" class="form-control">
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold small">Teléfono</label>
            <input type="text" id="formDatosTelefono" class="form-control">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold small">Fecha de Registro</label>
            <input type="date" id="formDatosFecha" class="form-control">
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold small">Email (Principal)</label>
            <input type="email" id="formDatosEmail" class="form-control">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold small">Correo (Alternativo)</label>
            <input type="email" id="formDatosCorreo" class="form-control">
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold small">GB promedio por backup</label>
            <input type="number" min="0" id="formDatosPromedio" class="form-control" placeholder="Ej: 800">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold small">Días entre backups</label>
            <input type="number" min="0" id="formDatosDias" class="form-control" placeholder="Ej: 5">
          </div>
        </div>
        <button id="btnGuardarBd" class="btn btn-success mt-3 w-100 fw-bold py-2 shadow-sm">
          <i class="bi bi-save"></i> GUARDAR DATOS
        </button>
      </form>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function() {

      // ==========================================
      // 1. CAPTURAR ELEMENTOS FIJOS
      // ==========================================
      const clienteSelect = document.getElementById("clienteSelect");
      const datoEncargado = document.getElementById("datoEncargado");
      const datoTelefono = document.getElementById("datoTelefono");
      const datoCorreo = document.getElementById("datoCorreo");

      const btnEntrar = document.getElementById("btnEntrar");
      const comboSelect = document.getElementById("operacionSelect");
      const contenedorDerecho = document.getElementById("divDerechoContenido");

      const btnRetroceder = document.querySelector('.btn-retroceder');
      const btnNuevoCliente = document.getElementById('btnNuevoCliente');

      // ==========================================
      // 2. EVENTO: CAMBIO DE CLIENTE (COMBO BOX IZQUIERDO)
      // ==========================================
      clienteSelect.addEventListener("change", function() {
          const seleccion = this.options[this.selectedIndex];
          if(seleccion && seleccion.value !== "") {
              // CORRECCIÓN: Usamos innerText porque ahora son DIVs, no inputs
              datoEncargado.innerText = seleccion.getAttribute("data-encargado") || "-";
              datoTelefono.innerText = seleccion.getAttribute("data-telefono") || "-";
              datoCorreo.innerText = seleccion.getAttribute("data-correo") || "-";
          } else {
              datoEncargado.innerText = "-";
              datoTelefono.innerText = "-";
              datoCorreo.innerText = "-";
          }
      });

      // ==========================================
      // 3. EVENTOS: BOTONES IZQUIERDOS
      // ==========================================
      if(btnRetroceder) {
          btnRetroceder.addEventListener('click', function() {
              clienteSelect.value = "";
              clienteSelect.dispatchEvent(new Event('change'));
              contenedorDerecho.innerHTML = `
                  <div class="h-100 d-flex flex-column justify-content-center align-items-center text-muted opacity-50">
                      <i class="bi bi-layers" style="font-size: 4rem;"></i>
                      <h4 class="mt-3">Seleccione una operación</h4>
                      <p>Haga clic en "Ejecutar Operación" en el panel izquierdo.</p>
                  </div>`;
          });
      }

      if(btnNuevoCliente) {
          btnNuevoCliente.addEventListener('click', function() {
              clienteSelect.value = "";
              clienteSelect.dispatchEvent(new Event('change'));
              if(comboSelect) comboSelect.value = "datos";
              if(btnEntrar) btnEntrar.click(); // Autoclic para abrir el formulario vacío
          });
      }

      // ==========================================
      // 4. EVENTO PRINCIPAL: EJECUTAR OPERACIÓN
      // ==========================================
      if(btnEntrar) {
          btnEntrar.addEventListener("click", function() {
              const clienteId = clienteSelect.value;
              const operacion = comboSelect.value;

              // Validación: Solo permite entrar sin cliente si vas a crear 'datos' nuevos
              if (clienteId === "" && operacion !== 'datos') {
                  alert("Por favor, seleccione una Empresa / Cliente en el panel izquierdo primero.");
                  return;
              }

              const templateId = "tpl-" + operacion;
              const template = document.getElementById(templateId);

              if (template) {
                  const contenido = template.content.cloneNode(true);
                  contenedorDerecho.innerHTML = '';
                  contenedorDerecho.appendChild(contenido);

                  let nombreEmpresa = "Empresa no seleccionada";
                  if (clienteSelect.selectedIndex > 0) {
                      nombreEmpresa = clienteSelect.options[clienteSelect.selectedIndex].text;
                  }
                  const nombreEncargado = datoEncargado.innerText || "-";

                  // ------------------------------------------
                  // PANTALLA: DATOS CLIENTE
                  // ------------------------------------------
                  if(operacion === 'datos') {
                      if (clienteId !== "") {
                          document.getElementById('formDatosId').value = clienteId;
                          document.getElementById('formDatosNombre').value = nombreEmpresa;
                          document.getElementById('formDatosEncargado').value = nombreEncargado !== "-" ? nombreEncargado : "";
                          document.getElementById('formDatosTelefono').value = datoTelefono.innerText !== "-" ? datoTelefono.innerText : "";
                          document.getElementById('formDatosEmail').value = datoCorreo.innerText !== "-" ? datoCorreo.innerText : "";
                        const optSel = clienteSelect.options[clienteSelect.selectedIndex];
                        document.getElementById('formDatosPromedio').value = optSel.getAttribute('data-promedio') || '';
                        document.getElementById('formDatosDias').value = optSel.getAttribute('data-dias') || '';
                      }

                      const btnGuardarBd = document.getElementById('btnGuardarBd');
                      if(btnGuardarBd) {
                          btnGuardarBd.addEventListener('click', function(e) {
                              e.preventDefault();
                              const clienteAguardar = {
                                  id: document.getElementById('formDatosId').value || null,
                                  nombre: document.getElementById('formDatosNombre').value,
                                  encargado: document.getElementById('formDatosEncargado').value,
                                  telefono: document.getElementById('formDatosTelefono').value,
                                  email: document.getElementById('formDatosEmail').value,
                                  correo: document.getElementById('formDatosCorreo').value,
                                fechaRegistro: document.getElementById('formDatosFecha').value || null,
                                promedioGbBackup: parseInt(document.getElementById('formDatosPromedio').value) || 0,
                                diasEntreBackups: parseInt(document.getElementById('formDatosDias').value) || 0                              };

                              fetch('/api/guardar-cliente', {
                                  method: 'POST',
                                  headers: { 'Content-Type': 'application/json' },
                                  body: JSON.stringify(clienteAguardar)
                              })
                              .then(res => res.json())
                              .then(data => {
                                  if (data.status === 'success') {
                                      alert('¡Datos guardados con éxito!');
                                      location.reload();
                                  } else {
                                      alert('Error al guardar en la base de datos.');
                                  }
                              });
                          });
                      }
                      return; // Termina la ejecución para la pantalla Datos
                  }

                // ------------------------------------------
                // PANTALLAS: INVENTARIO O RETIRO (Petición a PostgreSQL)
                // ------------------------------------------
                fetch('/api/cintas-cliente?id=' + clienteId)
                  .then(response => response.json())
                  .then(cintas => {
                //Ordenar todas las cintas alfabéticamente por Barcode (A-Z)
                      cintas.sort((a, b) => (a.barcode || "").localeCompare(b.barcode || ""));

                      // -- INVENTARIO --
                      if (operacion === 'inventario') {
                        const tbody = document.querySelector('.table tbody');
                        if (tbody) tbody.innerHTML = '';

                        let contRobot = 0, contArmario = 0, contVirgen = 0;

                        cintas.forEach(c => {
                          if (c.ubicacion === 'LIBRERIA') contRobot++;
                          if (c.ubicacion === 'ARMARIO') contArmario++;
                          if (c.volumeId === 'PENDIENTE') contVirgen++;

                          const tr = document.createElement('tr');
                          tr.innerHTML = `
                                  <td>${c.barcode}</td>
                                  <td>${c.volumeId}</td>
                                  <td>${c.tecnologia || '-'}</td>
                                  <td>-</td>
                                  <td>
                                      <select class="form-select form-select-sm select-ubicacion fw-bold border-secondary shadow-sm" data-barcode="${c.barcode}" style="width: 120px; font-size: 0.8rem;">
                                          <option value="LIBRERIA" ${c.ubicacion === 'LIBRERIA' ? 'selected' : ''}>Librería</option>
                                          <option value="ARMARIO" ${c.ubicacion === 'ARMARIO' ? 'selected' : ''}>Armario</option>
                                          <option value="RETIRADO" ${c.ubicacion === 'RETIRADO' ? 'selected' : ''}>Retirado</option>
                                      </select>
                                  </td>
                              `;
                          if (tbody) tbody.appendChild(tr);
                        });

                        const displays = document.querySelectorAll('.display-6');
                        if (displays.length >= 3) {
                          displays[0].innerText = contRobot;
                          displays[1].innerText = contArmario;
                          displays[2].innerText = contVirgen;
                        }

                        // ==========================================
                        // BUSCADOR EN VIVO: INVENTARIO
                        // ==========================================
                        const buscadorInv = document.getElementById('buscadorInventario');
                        if (buscadorInv && tbody) {
                          buscadorInv.addEventListener('keyup', function () {
                            const textoBusqueda = this.value.toLowerCase();
                            const filas = tbody.querySelectorAll('tr');

                            filas.forEach(fila => {
                              // textContent lee todo el texto de la fila (barcode, volumeId, etc.)
                              const contenidoFila = fila.textContent.toLowerCase();
                              // Si el texto de búsqueda está en la fila, la mostramos, sino la ocultamos
                              fila.style.display = contenidoFila.includes(textoBusqueda) ? '' : 'none';
                            });
                          });
                        }

                        // ==========================================
                        // ACTUALIZAR TÍTULO Y EXPORTAR A PDF: INVENTARIO
                        // ==========================================
                        // 1. Ponemos el nombre de la empresa en el subtítulo
                        const lblClienteInv = document.getElementById('nombreClienteInventario');
                        if (lblClienteInv) lblClienteInv.innerText = nombreEmpresa;

                        // 2. Lógica del botón PDF
                        const btnPdfInventario = document.getElementById('btnPdfInventario');
                        if (btnPdfInventario) {
                          btnPdfInventario.addEventListener('click', function (e) {
                            e.preventDefault();

                            // Feedback visual
                            const textoOriginal = this.innerHTML;
                            this.innerHTML = '<i class="bi bi-hourglass-split"></i> Generando...';
                            this.disabled = true;

                            const elementoOriginal = document.getElementById('zonaInventarioImprimible');

                            // TRUCO MAESTRO: Hacemos un clon de la tabla en memoria
                            const clonParaImprimir = elementoOriginal.cloneNode(true);

                            // Buscamos todos los <select> en el clon y los cambiamos por texto puro
                            const selects = clonParaImprimir.querySelectorAll('select');
                            selects.forEach(select => {
                              // Sacamos el texto (ej. "Librería")
                              const textoSeleccionado = select.options[select.selectedIndex].text;

                              // Creamos una etiqueta normal
                              const span = document.createElement('span');
                              span.className = 'fw-bold text-dark';
                              span.innerText = textoSeleccionado;

                              // Reemplazamos el select problemático por el texto
                              select.parentNode.replaceChild(span, select);
                            });

                            const opciones = {
                              margin: 10,
                              filename: `Inventario_${nombreEmpresa.replace(/\s+/g, '_')}.pdf`,
                              image: {type: 'jpeg', quality: 0.98},
                              html2canvas: {scale: 2},
                              jsPDF: {unit: 'mm', format: 'a4', orientation: 'landscape'} // Horizontal
                            };

                            // Le pasamos el CLON LIMPIO a la librería
                            html2pdf().set(opciones).from(clonParaImprimir).save().then(() => {
                              // Restauramos el botón al terminar
                              this.innerHTML = textoOriginal;
                              this.disabled = false;
                            }).catch(err => {
                              console.error("Error al generar PDF:", err);
                              this.innerHTML = textoOriginal;
                              this.disabled = false;
                              alert("Hubo un problema al generar el PDF.");
                            });
                          });
                        }

                        // Lógica del Select de Cambio de Ubicación (sin recargar la tabla)
                        document.querySelectorAll('.select-ubicacion').forEach(select => {
                          select.addEventListener('change', function () {
                            const barcode = this.getAttribute('data-barcode');
                            const nuevaUbi = this.value;
                            fetch(`/api/actualizar-ubicacion?barcode=${barcode}&ubicacion=${nuevaUbi}`, {method: 'POST'})
                                    .then(res => res.json())
                                    .then(data => {
                                      if (data.status === 'success') {
                                        // Actualizamos el dato en memoria y recalculamos los contadores
                                        const cintaMod = cintas.find(c => c.barcode === barcode);
                                        if (cintaMod) cintaMod.ubicacion = nuevaUbi;

                                        let r = 0, a = 0, v = 0;
                                        cintas.forEach(c => {
                                          if (c.ubicacion === 'LIBRERIA') r++;
                                          if (c.ubicacion === 'ARMARIO') a++;
                                          if (c.volumeId === 'PENDIENTE') v++;
                                        });
                                        const disp = document.querySelectorAll('.display-6');
                                        if (disp.length >= 3) {
                                          disp[0].innerText = r;
                                          disp[1].innerText = a;
                                          disp[2].innerText = v;
                                        }
                                      }
                                    });
                          });
                        });
                      }
                      // -- RETIRO CINTAS --
                      if (operacion === 'retiro') {
                          document.getElementById('actaClienteNombre').innerText = nombreEmpresa;
                          document.getElementById('actaClienteEncargado').innerText = nombreEncargado;
                          document.getElementById('fechaActual').innerText = new Date().toLocaleDateString('es-PY');

                          const firmaEncargado = document.getElementById('firmaNombreEncargado');
                          if(firmaEncargado) firmaEncargado.innerText = nombreEncargado;
                          const tbody = document.querySelector('.table tbody');
                          if(tbody) tbody.innerHTML = '';

                          cintas.filter(c => c.ubicacion !== 'RETIRADO').forEach(c => {
                              const tr = document.createElement('tr');
                              tr.innerHTML = `
                                  <td><input class="form-check-input check-retiro" type="checkbox" data-barcode="${c.barcode}" data-vol="${c.volumeId}"></td>
                                  <td>${c.barcode}</td><td>${c.volumeId}</td><td>${c.tecnologia || '-'}</td>
                              `;
                              if(tbody) tbody.appendChild(tr);
                          });

                          const checkboxes = document.querySelectorAll('.check-retiro');
                          const listaActa = document.getElementById('listaCintasActa');
                          const contadorCintas = document.getElementById('contadorCintas');

                          function actualizarActa() {
                              if(listaActa) listaActa.innerHTML = '';
                              let cantidad = 0;
                              checkboxes.forEach(cb => {
                                  if (cb.checked) {
                                      cantidad++;
                                      const barcode = cb.getAttribute('data-barcode');
                                      const vol = cb.getAttribute('data-vol');
                                      const li = document.createElement('li');
                                      li.innerHTML = `<i class="bi bi-check-circle-fill text-success me-2"></i> ${barcode} <span class="text-muted small">(${vol})</span>`;
                                      li.className = "mb-1";
                                      if(listaActa) listaActa.appendChild(li);
                                  }
                              });
                              if(contadorCintas) contadorCintas.innerText = cantidad;
                              if (cantidad === 0 && listaActa) listaActa.innerHTML = '<li><em class="text-muted fw-normal">Seleccione cintas en la tabla...</em></li>';
                          }

                          checkboxes.forEach(cb => cb.addEventListener('change', actualizarActa));

                        // ==========================================
                        // BUSCADOR EN VIVO: RETIRO
                        // ==========================================
                        const buscadorRet = document.getElementById('buscadorRetiro');
                        if (buscadorRet && tbody) {
                            buscadorRet.addEventListener('keyup', function() {
                                const textoBusqueda = this.value.toLowerCase();
                                const filas = tbody.querySelectorAll('tr');

                                filas.forEach(fila => {
                                    const contenidoFila = fila.textContent.toLowerCase();
                                    fila.style.display = contenidoFila.includes(textoBusqueda) ? '' : 'none';
                                });
                            });
                        }
                          // Evento: Botón Exportar PDF
                          const btnExportarPdf = document.getElementById('btnExportarPdf');
                          if (btnExportarPdf) {
                              btnExportarPdf.addEventListener('click', function() {
                                  const cantCintas = parseInt(contadorCintas.innerText);
                                  if (cantCintas === 0) {
                                      alert("Seleccione al menos una cinta para generar el acta.");
                                      return;
                                  }
                                  const elementoAImprimir = document.getElementById('zonaActaImprimible');
                                  const opciones = {
                                      margin: 10,
                                      filename: `Acta_Retiro_${nombreEmpresa.replace(/\s+/g, '_')}.pdf`,
                                      image: { type: 'jpeg', quality: 0.98 },
                                      html2canvas: { scale: 2 },
                                      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                                  };
                                  html2pdf().set(opciones).from(elementoAImprimir).save();
                              });
                          }

                          // Evento: Botón Procesar Retiro (Base de Datos)
                        const btnProcesarRetiro = document.getElementById('btnProcesarRetiro');
                        if (btnProcesarRetiro) {
                          btnProcesarRetiro.addEventListener('click', function() {
                            const seleccionados = document.querySelectorAll('.check-retiro:checked');
                            const barcodes = Array.from(seleccionados).map(cb => cb.getAttribute('data-barcode'));
                            if (barcodes.length === 0) {
                              alert('Seleccione al menos una cinta para retirar.');
                              return;
                            }
                            if (confirm(`¿Está seguro de que desea procesar el retiro de ${barcodes.length} cinta(s)?`)) {
                              const clienteId = clienteSelect.value;
                              fetch('/api/comprobante-retiro?clienteId=' + clienteId, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(barcodes)
                              })
                                      .then(resp => { if (!resp.ok) throw new Error('error'); return resp.blob(); })
                                      .then(blob => {
                                        const url = window.URL.createObjectURL(blob);
                                        const a = document.createElement('a');
                                        a.href = url;
                                        a.download = 'acta_retiro.pdf';
                                        document.body.appendChild(a);
                                        a.click();
                                        a.remove();
                                        window.URL.revokeObjectURL(url);
                                        alert('¡Retiro procesado! Se descargó y guardó el comprobante.');
                                        btnEntrar.click();
                                      })
                                      .catch(err => alert('Ocurrió un error al procesar el retiro.'));
                            }
                          });
                        }
                      } // Fin Retiro
                    })
                    .catch(error => console.error("Error al obtener datos:", error));
              } // Fin if(template)
          });
      }
  });
</script>
</body>
</html>
