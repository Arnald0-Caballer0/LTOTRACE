<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>ATOPA - Módulo Clientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root { --navbar-h: 56px; --sidebar-bg: #1a202c; --content-bg: #f4f7f9; }
    body, html { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }
    .navbar-custom { z-index: 1200; height: var(--navbar-h); }
    .layout-wrapper { display: flex; height: calc(100vh - var(--navbar-h)); margin-top: var(--navbar-h); }

    .div-izquierdo { width: 30%; background-color: var(--sidebar-bg); color: white; padding: 2rem; position: relative; display: flex; flex-direction: column; box-shadow: 4px 0 15px rgba(0,0,0,0.1); z-index: 1100; }
    .div-derecho { width: 70%; background-color: var(--content-bg); padding: 2rem; overflow-y: auto; }

    .input-cliente { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; font-size: 0.9rem; }
    .input-cliente:focus { background: rgba(255,255,255,0.1); color: white; border-color: #0d6efd; box-shadow: none; }
    .input-cliente::placeholder { color: rgba(255,255,255,0.4); }
    .btn-retroceder { position: absolute; top: 1rem; right: 1rem; }

    /* Estilos extra para las tarjetas del dashboard */
    .dash-card { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; }
    .dash-card:hover { transform: translateY(-3px); }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark navbar-custom fixed-top shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold px-3" href="/">ATOPA</a>
    <div class="navbar-nav ms-auto"><a class="nav-link px-3" href="/"><i class="bi bi-house"></i> Volver al Panel LTO</a></div>
  </div>
</nav>

<div class="layout-wrapper">
  <div class="div-izquierdo">
    <button class="btn btn-sm btn-outline-light btn-retroceder" title="Deshacer operación"><i class="bi bi-arrow-counterclockwise"></i></button>

    <div class="mb-4 mt-2">
      <label class="text-uppercase small fw-bold text-white-50 mb-1" style="letter-spacing: 1px;">Empresa / Cliente</label>
      <div class="d-flex gap-2">
        <select id="clienteSelect" class="form-select input-cliente fw-bold fs-5 text-white flex-grow-1" style="background-color: rgba(255,255,255,0.05); cursor: pointer;">
          <option value="" class="text-dark">-- Seleccione una empresa --</option>
          <option th:each="cliente : ${listaClientes}"
                  th:value="${cliente.id}" th:text="${cliente.nombre}"
                  th:data-encargado="${cliente.encargado}" th:data-telefono="${cliente.telefono}" th:data-correo="${cliente.email}" class="text-dark">
          </option>
        </select>
        <button id="btnNuevoCliente" class="btn btn-success shadow-sm" title="Crear Nuevo Cliente"><i class="bi bi-plus-lg fw-bold"></i></button>
      </div>
    </div>

    <div class="mb-3">
      <label class="small text-white-50 mb-1"><i class="bi bi-person"></i> Encargado</label>
      <div id="datoEncargado" class="text-light fw-bold border-bottom border-secondary pb-1" style="min-height: 24px;">-</div>
    </div>
    <div class="mb-3">
      <label class="small text-white-50 mb-1"><i class="bi bi-telephone"></i> Teléfono</label>
      <div id="datoTelefono" class="text-light fw-bold border-bottom border-secondary pb-1" style="min-height: 24px;">-</div>
    </div>
    <div class="mb-4">
      <label class="small text-white-50 mb-1"><i class="bi bi-envelope"></i> Correo</label>
      <div id="datoCorreo" class="text-light fw-bold border-bottom border-secondary pb-1" style="min-height: 24px;">-</div>
    </div>

    <div class="mb-4 p-3 rounded" style="background: rgba(0,0,0,0.2);">
      <label class="fw-bold mb-2 text-info"><i class="bi bi-gear-fill"></i> Operación a realizar</label>
      <select id="operacionSelect" class="form-select bg-dark text-light border-secondary shadow-sm">
        <option value="inventario">Inventario</option>
        <option value="retiro">Retiro Cintas</option>
        <option value="datos">Datos cliente</option>
      </select>
    </div>

    <div class="flex-grow-1"></div>
    <button id="btnEntrar" class="btn btn-primary w-100 py-3 fw-bold fs-6 shadow">
      EJECUTAR OPERACIÓN <i class="bi bi-arrow-right-circle ms-2"></i>
    </button>
  </div>

  <div class="div-derecho" id="divDerechoContenido">
    <div class="h-100 d-flex flex-column justify-content-center align-items-center text-muted opacity-50">
      <i class="bi bi-layers" style="font-size: 4rem;"></i>
      <h4 class="mt-3">Seleccione una operación</h4>
      <p>Haga clic en "Ejecutar Operación" en el panel izquierdo.</p>
    </div>
  </div>
</div>

<template id="tpl-inventario">
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card dash-card bg-primary text-white h-100">
        <div class="card-body">
          <h6 class="card-title opacity-75"><i class="bi bi-robot"></i> Librería Robot</h6>
          <h2 class="display-6 fw-bold mb-0">15</h2>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card dash-card bg-success text-white h-100">
        <div class="card-body">
          <h6 class="card-title opacity-75"><i class="bi bi-safe"></i> En Armario</h6>
          <h2 class="display-6 fw-bold mb-0">42</h2>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card dash-card bg-secondary text-white h-100">
        <div class="card-body">
          <h6 class="card-title opacity-75"><i class="bi bi-disc"></i> Vírgenes</h6>
          <h2 class="display-6 fw-bold mb-0">8</h2>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-end mb-3">
    <div>
      <h4 class="fw-bold text-dark mb-0">Total Cintas</h4>
      <small class="text-muted">Inventario completo del cliente</small>
    </div>
    <div style="width: 300px;">
      <input type="text" class="form-control" placeholder="Buscar cinta, barcode...">
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
        <tr>
          <th>Barcode</th>
          <th>Nombre (Volume ID)</th>
          <th>Tecnología</th>
          <th>Usos</th>
          <th>Estado</th>
        </tr>
        </thead>
      </table>
    </div>
  </div>
</template>

<template id="tpl-retiro">
  <div class="row h-100">
    <div class="col-md-7 d-flex flex-column h-100">
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Buscar cinta para retirar...">
      </div>
      <div class="card border-0 shadow-sm flex-grow-1 overflow-auto">
        <table class="table table-hover mb-0">
          <thead class="table-light sticky-top">
          <tr>
            <th width="50">Sel.</th>
            <th>Barcode</th>
            <th>Nombre</th>
            <th>Tech</th>
          </tr>
          </thead>
          <tbody>
          <tr>
            <td><input class="form-check-input check-retiro" type="checkbox" data-barcode="CLN123L7" data-vol="TAP001"></td>
            <td>CLN123L7</td><td>TAP001</td><td>LTO-7</td>
          </tr>
          <tr>
            <td><input class="form-check-input check-retiro" type="checkbox" data-barcode="ABC456L8" data-vol="TAP002"></td>
            <td>ABC456L8</td><td>TAP002</td><td>LTO-8</td>
          </tr>
          <tr>
            <td><input class="form-check-input check-retiro" type="checkbox" data-barcode="XYZ789L8" data-vol="TAP003"></td>
            <td>XYZ789L8</td><td>TAP003</td><td>LTO-8</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="col-md-5 d-flex flex-column h-100">
      <div id="zonaActaImprimible" class="card border-0 shadow-sm flex-grow-1 mb-3 bg-light" style="padding: 10px;">
        <div class="card-body">
          <h5 class="fw-bold mb-4 text-center">Acta de Retiro</h5>
          <p class="mb-1 small"><strong>Cliente:</strong> <span id="actaClienteNombre" class="text-primary fw-bold">Seleccione un cliente</span></p>
          <p class="mb-1 small"><strong>Encargado:</strong> <span id="actaClienteEncargado">-</span></p>
          <p class="mb-4 small"><strong>Fecha:</strong> <span id="fechaActual"></span></p>
          <hr>
          <h6 class="small fw-bold text-muted">CINTAS A RETIRAR (<span id="contadorCintas">0</span>)</h6>
          <ul id="listaCintasActa" class="list-unstyled small text-primary fw-semibold">
            <li><em class="text-muted fw-normal">Seleccione cintas en la tabla...</em></li>
          </ul>
        </div>
      </div>

      <div class="d-flex justify-content-between mb-3">
        <button class="btn btn-outline-primary btn-sm w-100 me-1"><i class="bi bi-envelope"></i> Email</button>
        <button class="btn btn-outline-success btn-sm w-100 mx-1"><i class="bi bi-file-earmark-excel"></i> Excel</button>

        <button id="btnExportarPdf" class="btn btn-outline-danger btn-sm w-100 ms-1"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
      </div>

      <button id="btnProcesarRetiro" class="btn btn-warning w-100 fw-bold py-3 shadow-sm">
        <i class="bi bi-box-arrow-right"></i> PROCESAR RETIRO
      </button>
    </div>
  </div>
</template>

<template id="tpl-datos">
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white py-3">
      <h5 class="fw-bold mb-0">Ficha del Cliente</h5>
    </div>
    <div class="card-body p-4">
      <form id="formClienteBD">
        <input type="hidden" id="formDatosId">

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold small">Razón Social (Nombre)</label>
            <input type="text" id="formDatosNombre" class="form-control" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold small">Encargado</label>
            <input type="text" id="formDatosEncargado" class="form-control">
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold small">Teléfono</label>
            <input type="text" id="formDatosTelefono" class="form-control">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold small">Fecha de Registro</label>
            <input type="date" id="formDatosFecha" class="form-control">
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold small">Email (Principal)</label>
            <input type="email" id="formDatosEmail" class="form-control">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold small">Correo (Alternativo)</label>
            <input type="email" id="formDatosCorreo" class="form-control">
          </div>
        </div>

        <button id="btnGuardarBd" class="btn btn-success mt-3 w-100 fw-bold py-2 shadow-sm">
          <i class="bi bi-save"></i> GUARDAR DATOS
        </button>
      </form>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {

    // ==========================================
    // 1. ELEMENTOS DE LA INTERFAZ
    // ==========================================
    const clienteSelect = document.getElementById("clienteSelect");
    const datoEncargado = document.getElementById("datoEncargado");
    const datoTelefono = document.getElementById("datoTelefono");
    const datoCorreo = document.getElementById("datoCorreo");

    const btnEntrar = document.getElementById("btnEntrar");
    const comboSelect = document.getElementById("operacionSelect");
    const contenedorDerecho = document.getElementById("divDerechoContenido");

    // ==========================================
    // 2. EVENTO: CAMBIAR CLIENTE (LLENA EL FORMULARIO IZQUIERDO)
    // ==========================================
    clienteSelect.addEventListener("change", function() {
      const seleccion = this.options[this.selectedIndex];
      if(seleccion.value !== "") {
        // Usamos innerText porque ahora son etiquetas DIV, no inputs
        datoEncargado.innerText = seleccion.getAttribute("data-encargado") || "-";
        datoTelefono.innerText = seleccion.getAttribute("data-telefono") || "-";
        datoCorreo.innerText = seleccion.getAttribute("data-correo") || "-";
      } else {
        datoEncargado.innerText = "-"; datoTelefono.innerText = "-"; datoCorreo.innerText = "-";
      }
    });

    // ------------------------------------------
    // BOTÓN DE RETROCESO (LIMPIAR PANTALLA)
    // ------------------------------------------
    const btnRetroceder = document.querySelector('.btn-retroceder');
    if(btnRetroceder) {
      btnRetroceder.addEventListener('click', function() {
        clienteSelect.value = "";
        clienteSelect.dispatchEvent(new Event('change')); // Limpia los textos
        contenedorDerecho.innerHTML = `
                <div class="h-100 d-flex flex-column justify-content-center align-items-center text-muted opacity-50">
                    <i class="bi bi-layers" style="font-size: 4rem;"></i>
                    <h4 class="mt-3">Seleccione una operación</h4>
                    <p>Haga clic en "Ejecutar Operación" en el panel izquierdo.</p>
                </div>`;
      });
    }

    // ------------------------------------------
    // BOTÓN NUEVO CLIENTE
    // ------------------------------------------
    const btnNuevoCliente = document.getElementById('btnNuevoCliente');
    if(btnNuevoCliente) {
      btnNuevoCliente.addEventListener('click', function() {
        clienteSelect.value = ""; // Deseleccionamos todo
        clienteSelect.dispatchEvent(new Event('change'));
        comboSelect.value = "datos"; // Forzamos la operación a "Datos cliente"
        document.getElementById("btnEntrar").click(); // Simulamos el clic
      });
    }

    // ==========================================
    // 3. EVENTO: CLIC EN "EJECUTAR OPERACIÓN"
    // ==========================================
    btnEntrar.addEventListener("click", function() {
      const clienteId = clienteSelect.value;
      const operacion = comboSelect.value;

      // Validación de seguridad
      if (clienteId === "" && operacion !== 'datos') {
        alert("Por favor, seleccione una Empresa / Cliente en el panel izquierdo primero.");
        return;
      }

      const templateId = "tpl-" + operacion;
      const template = document.getElementById(templateId);

      if (template) {
        // Clonar e inyectar la pantalla seleccionada
        const contenido = template.content.cloneNode(true);
        contenedorDerecho.innerHTML = '';
        contenedorDerecho.appendChild(contenido);

        let nombreEmpresa = clienteSelect.options[clienteSelect.selectedIndex].text;
        const nombreEncargado = datoEncargado.value || "-";

// ------------------------------------------
        // Lógica si la pantalla es: DATOS CLIENTE
        // ------------------------------------------
        if(operacion === 'datos') {
          // 1. Pre-llenamos el formulario con los datos que ya sabemos del panel izquierdo
          if (clienteId !== "") {
            document.getElementById('formDatosId').value = clienteId;
            document.getElementById('formDatosNombre').value = nombreEmpresa;
            document.getElementById('formDatosEncargado').value = nombreEncargado;
            document.getElementById('formDatosTelefono').value = datoTelefono.value;
            document.getElementById('formDatosEmail').value = datoCorreo.value;
            // Fecha y Correo alternativo quedarán en blanco hasta que los llenes y guardes
          }

          // 2. Escuchamos cuando le den clic a Guardar
          const btnGuardarBd = document.getElementById('btnGuardarBd');
          btnGuardarBd.addEventListener('click', function(e) {
            e.preventDefault(); // Evitamos que la página se recargue de golpe

            // Armamos el paquete JSON exacto como lo espera tu clase Cliente.java
            const clienteAguardar = {
              id: document.getElementById('formDatosId').value || null,
              nombre: document.getElementById('formDatosNombre').value,
              encargado: document.getElementById('formDatosEncargado').value,
              telefono: document.getElementById('formDatosTelefono').value,
              email: document.getElementById('formDatosEmail').value,
              correo: document.getElementById('formDatosCorreo').value,
              fechaRegistro: document.getElementById('formDatosFecha').value || null
            };

            // Enviamos al servidor
            fetch('/api/guardar-cliente', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(clienteAguardar)
            })
                    .then(response => response.json())
                    .then(data => {
                      if (data.status === 'success') {
                        alert('¡Datos guardados con éxito en la base de datos!');
                        location.reload(); // Recargamos para que el combo box se actualice
                      } else {
                        alert('Error al guardar en la base de datos.');
                      }
                    })
                    .catch(err => console.error(err));
          });
          return; // Terminamos aquí esta operación
        }

        // ==========================================
        // LA MAGIA DE LA FASE 2: CONSULTAR API DE CINTAS
        // ==========================================
        fetch('/api/cintas-cliente?id=' + clienteId)
                .then(response => response.json())
                .then(cintas => {

                  // ------------------------------------------
                  // Lógica si la pantalla es: INVENTARIO
                  // ------------------------------------------
                  if (operacion === 'inventario') {
                    const tbody = document.querySelector('.table tbody');
                    tbody.innerHTML = ''; // Limpiamos las cintas de prueba

                    let contRobot = 0, contArmario = 0, contVirgen = 0;

                    cintas.forEach(c => {
                      // Sumamos para los Dashboards según los datos de tu BD
                      if (c.ubicacion === 'LIBRERIA') contRobot++;
                      if (c.ubicacion === 'ARMARIO') contArmario++;
                      if (c.estado === 'VIRGEN') contVirgen++;

                      // Creamos las filas reales
                      const tr = document.createElement('tr');
                      let badgeClass = c.ubicacion === 'LIBRERIA' ? 'bg-primary' : (c.ubicacion === 'RETIRADO' ? 'bg-danger' : 'bg-success');
                      tr.innerHTML = `
                  <td>${c.barcode}</td>
                  <td>${c.volumeId}</td>
                  <td>${c.tecnologia || '-'}</td>
                  <td>-</td>
                  <td>
                      <select class="form-select form-select-sm select-ubicacion fw-bold border-secondary shadow-sm" data-barcode="${c.barcode}" style="width: 120px; font-size: 0.8rem;">
                          <option value="LIBRERIA" ${c.ubicacion === 'LIBRERIA' ? 'selected' : ''}>Librería</option>
                          <option value="ARMARIO" ${c.ubicacion === 'ARMARIO' ? 'selected' : ''}>Armario</option>
                          <option value="RETIRADO" ${c.ubicacion === 'RETIRADO' ? 'selected' : ''}>Retirado</option>
                      </select>
                  </td>
                `;
                      tbody.appendChild(tr);
                    }); // Fin del forEach

                    //Detectar cuando cambias el estado de una cinta en la tabla
                    document.querySelectorAll('.select-ubicacion').forEach(select => {
                      select.addEventListener('change', function() {
                        const barcode = this.getAttribute('data-barcode');
                        const nuevaUbi = this.value;

                        fetch(`/api/actualizar-ubicacion?barcode=${barcode}&ubicacion=${nuevaUbi}`, { method: 'POST' })
                                .then(res => res.json())
                                .then(data => {
                                  if (data.status === 'success') {
                                    // Simulamos presionar Enter de nuevo para recalcular el Dashboard y la tabla automáticamente
                                    document.getElementById("btnEntrar").click();
                                  }
                                });
                      });
                    });

                    // Actualizamos los números grandes de arriba
                    const displays = document.querySelectorAll('.display-6');
                    if(displays.length >= 3) {
                      displays[0].innerText = contRobot;
                      displays[1].innerText = contArmario;
                      displays[2].innerText = contVirgen;
                    }
                  }

                  // ------------------------------------------
                  // Lógica si la pantalla es: RETIRO CINTAS
                  // ------------------------------------------
                  if (operacion === 'retiro') {
                    document.getElementById('actaClienteNombre').innerText = nombreEmpresa;
                    document.getElementById('actaClienteEncargado').innerText = nombreEncargado;
                    document.getElementById('fechaActual').innerText = new Date().toLocaleDateString('es-PY');

                    const tbody = document.querySelector('.table tbody');
                    tbody.innerHTML = ''; // Limpiamos las cintas de prueba

                    // Llenamos la tabla izquierda solo con las cintas que NO estén retiradas
                    cintas.filter(c => c.ubicacion !== 'RETIRADO').forEach(c => {
                      const tr = document.createElement('tr');
                      tr.innerHTML = `
                    <td><input class="form-check-input check-retiro" type="checkbox" data-barcode="${c.barcode}" data-vol="${c.volumeId}"></td>
                    <td>${c.barcode}</td><td>${c.volumeId}</td><td>${c.tecnologia || '-'}</td>
                  `;
                      tbody.appendChild(tr);
                    });

                    // Reconectamos la lógica del Acta a la derecha
                    const checkboxes = document.querySelectorAll('.check-retiro');
                    const listaActa = document.getElementById('listaCintasActa');
                    const contadorCintas = document.getElementById('contadorCintas');

                    function actualizarActa() {
                      listaActa.innerHTML = '';
                      let cantidad = 0;
                      checkboxes.forEach(cb => {
                        if (cb.checked) {
                          cantidad++;
                          const barcode = cb.getAttribute('data-barcode');
                          const vol = cb.getAttribute('data-vol');
                          const li = document.createElement('li');
                          li.innerHTML = `<i class="bi bi-check-circle-fill text-success me-2"></i> ${barcode} <span class="text-muted small">(${vol})</span>`;
                          li.className = "mb-1";
                          listaActa.appendChild(li);
                        }
                      });
                      contadorCintas.innerText = cantidad;
                      if (cantidad === 0) listaActa.innerHTML = '<li><em class="text-muted fw-normal">Seleccione cintas en la tabla...</em></li>';
                    }

                    checkboxes.forEach(cb => cb.addEventListener('change', actualizarActa));
                    // ==========================================
                    // LÓGICA DEL BOTÓN: PROCESAR RETIRO
                    // ==========================================
                    const btnProcesarRetiro = document.getElementById('btnProcesarRetiro');
                    if (btnProcesarRetiro) {
                      btnProcesarRetiro.addEventListener('click', function() {

                        // 1. Recolectamos solo los barcodes de las casillas que están marcadas
                        const seleccionados = document.querySelectorAll('.check-retiro:checked');
                        const barcodes = Array.from(seleccionados).map(cb => cb.getAttribute('data-barcode'));

                        // 2. Validamos que haya seleccionado algo
                        if (barcodes.length === 0) {
                          alert('Por favor, seleccione al menos una cinta en la tabla izquierda para retirar.');
                          return;
                        }

                        // 3. Confirmación de seguridad
                        if (confirm(`¿Está seguro de que desea procesar el retiro de ${barcodes.length} cinta(s)?`)) {

                          // 4. Enviamos la lista al backend (Java) mediante método POST
                          fetch('/api/retirar-cintas', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(barcodes)
                          })
                                  .then(response => response.json())
                                  .then(data => {
                                    if (data.status === 'success') {
                                      alert('¡Retiro procesado exitosamente en la base de datos!');
                                      // TRUCO: Simulamos un clic en "Ejecutar" para recargar la tabla y limpiar la pantalla
                                      document.getElementById("btnEntrar").click();
                                    } else {
                                      alert('Hubo un error al comunicarse con el servidor.');
                                    }
                                  })
                                  .catch(error => console.error('Error:', error));
                        }
                      });
                    }
                    // ==========================================
                    // LÓGICA DEL BOTÓN: EXPORTAR A PDF
                    // ==========================================
                    const btnExportarPdf = document.getElementById('btnExportarPdf');
                    if (btnExportarPdf) {
                      btnExportarPdf.addEventListener('click', function() {
                        // 1. Verificamos que haya cintas seleccionadas en el acta
                        const cantCintas = parseInt(document.getElementById('contadorCintas').innerText);
                        if (cantCintas === 0) {
                          alert("Seleccione al menos una cinta para generar el acta.");
                          return;
                        }

                        // 2. Tomamos la zona del HTML que queremos convertir
                        const elementoAImprimir = document.getElementById('zonaActaImprimible');

                        // 3. Configuramos cómo queremos el PDF
                        const opciones = {
                          margin:       10, // Márgenes en milímetros
                          filename:     `Acta_Retiro_${nombreEmpresa.replace(/\s+/g, '_')}.pdf`, // Nombre dinámico
                          image:        { type: 'jpeg', quality: 0.98 },
                          html2canvas:  { scale: 2 }, // Mejora la nitidez de las letras
                          jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                        };

                        // 4. Disparamos la magia
                        html2pdf().set(opciones).from(elementoAImprimir).save();
                      });
                    }
                  }
                })
                .catch(error => console.error("Error al obtener las cintas:", error));
      }
    });
  });
</script>
</body>
</html>
