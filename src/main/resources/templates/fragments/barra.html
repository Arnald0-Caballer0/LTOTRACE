<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Barra lateral de navegación de LTOTRACE (reutilizable).
  Uso en cada página:
     <div th:replace="~{fragments/barra :: rail('dashboard')}"></div>
  El parámetro marca el módulo activo: 'dashboard', 'cintas', 'clientes' o 'usuarios'.
-->
<nav class="lto-rail" th:fragment="rail(activo)">

    <div class="lto-rail-top">
        <button type="button" class="lto-rail-toggle" id="ltoRailToggle" title="Expandir / Contraer">
            <i class="bi bi-list"></i>
        </button>
        <span class="lto-rail-brand brand-lto">LTO<span class="accent">TRACE</span></span>
    </div>

    <ul class="lto-rail-menu">
        <!-- Dashboard -->
        <li th:classappend="${activo == 'dashboard'} ? 'activo'">
            <a href="/"><i class="bi bi-grid-1x2"></i><span class="lto-rail-label">Dashboard</span></a>
        </li>

        <!-- Cintas (con sub-opciones) -->
        <li class="tiene-sub" th:classappend="${activo == 'cintas'} ? 'activo'">
            <a href="/cintas"><i class="bi bi-hdd-stack"></i><span class="lto-rail-label">Cintas</span></a>
            <div class="lto-flyout">
                <div class="lto-flyout-title">Cintas</div>
                <a href="/cintas"><i class="bi bi-list-ul"></i> Ver cintas</a>
                <a href="/cintas?crear=1"><i class="bi bi-plus-lg"></i> Crear cintas</a>
            </div>
        </li>

        <!-- Cliente (con sub-opciones) -->
        <li class="tiene-sub" th:classappend="${activo == 'clientes'} ? 'activo'">
            <a href="/clientes"><i class="bi bi-people"></i><span class="lto-rail-label">Cliente</span></a>
            <div class="lto-flyout">
                <div class="lto-flyout-title">Cliente</div>
                <a href="/clientes?op=inventario"><i class="bi bi-box-seam"></i> Inventario</a>
                <a href="/clientes?op=retiro"><i class="bi bi-box-arrow-right"></i> Retiro de cintas</a>
                <a href="/clientes?op=datos"><i class="bi bi-person-lines-fill"></i> Datos del cliente</a>
            </div>
        </li>

        <!-- Usuarios -->
        <li th:classappend="${activo == 'usuarios'} ? 'activo'">
            <a href="/usuarios"><i class="bi bi-person-gear"></i><span class="lto-rail-label">Usuarios</span></a>
        </li>
    </ul>

    <div class="lto-rail-bottom">
        <a href="/logout"><i class="bi bi-box-arrow-right"></i><span class="lto-rail-label">Cerrar sesión</span></a>
    </div>

    <script>
        (function () {
            var t = document.getElementById('ltoRailToggle');
            if (t) {
                t.addEventListener('click', function () {
                    document.body.classList.toggle('rail-expanded');
                });
            }
        })();
    </script>
</nav>

</body>
</html>
