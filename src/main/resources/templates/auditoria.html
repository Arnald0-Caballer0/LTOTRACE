<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LTOTRACE · Auditoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/lto.css">
    <style>
        body, html { height:100%; overflow:hidden; font-family:'Inter','Segoe UI',sans-serif; }
        .modulo-wrapper { padding:1rem 1.5rem; height:100vh; display:flex; flex-direction:column; }
        .modulo-header { flex-shrink:0; margin-bottom:1rem; }
        .modulo-body { flex-grow:1; min-height:0; display:flex; flex-direction:column; }
        .tabla-card { background:#fff; border:1px solid var(--lto-borde); border-radius:12px; box-shadow:0 2px 12px rgba(52,55,52,.05); flex-grow:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
        .tabla-toolbar { padding:.75rem 1rem; border-bottom:1px solid var(--lto-borde); flex-shrink:0; }
        .tabla-scroll { overflow:auto; flex-grow:1; }
        table.tabla-aud thead th { background:#f3f5ef !important; color:var(--lto-oscuro) !important; text-transform:none !important; letter-spacing:0 !important; font-weight:600; font-size:.82rem; border-bottom:1px solid var(--lto-borde) !important; padding:.7rem 1rem; position:sticky; top:0; z-index:5; }
        table.tabla-aud tbody td { padding:.7rem 1rem; vertical-align:middle; border-color:#eef0ea; font-size:.9rem; }
        table.tabla-aud tbody tr:hover { background:rgba(112,161,189,.06); }
        .fecha-col { white-space:nowrap; color:var(--lto-gris); font-size:.85rem; }
        .seguridad-nota { color:var(--lto-gris); font-size:.8rem; display:flex; align-items:center; gap:5px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/barra :: rail('auditoria')}"></div>

<div class="app-content">
    <div class="modulo-wrapper">

        <header class="modulo-header">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h4 class="fw-bold m-0"><i class="bi bi-journal-text"></i> Auditoría del sistema</h4>
                    <div class="seguridad-nota mt-1"><i class="bi bi-shield-lock"></i> Registro de eventos de seguridad · últimos 500</div>
                </div>
                <span class="badge bg-primary" style="font-size:.85rem;">Eventos: <span id="totalEventos">0</span></span>
            </div>
        </header>

        <div class="modulo-body">
            <div class="tabla-card">
                <div class="tabla-toolbar d-flex flex-wrap gap-2">
                    <input type="text" id="buscador" class="form-control form-control-sm" style="max-width:320px"
                           placeholder="Buscar por usuario, evento o detalle...">
                    <select id="filtroTipo" class="form-select form-select-sm" style="max-width:200px">
                        <option value="">Todos los eventos</option>
                        <option value="LOGIN">Inicio de sesión</option>
                        <option value="LOGIN_FALLIDO">Login fallido</option>
                        <option value="LOGOUT">Cierre de sesión</option>
                        <option value="USUARIO_CREADO">Usuario creado</option>
                        <option value="USUARIO_ESTADO">Cambio de estado</option>
                        <option value="USUARIO_PASSWORD">Reset de contraseña</option>
                        <option value="CONFIG_TECNOLOGIA">Cambio de tecnología</option>
                        <option value="CONFIG_LIBRERIA">Cambio de conexión</option>
                    </select>
                </div>
                <div class="tabla-scroll">
                    <table class="table tabla-aud mb-0">
                        <thead>
                        <tr>
                            <th>Fecha y hora</th>
                            <th>Usuario</th>
                            <th>Evento</th>
                            <th>Detalle</th>
                            <th>IP</th>
                        </tr>
                        </thead>
                        <tbody id="tbodyAud">
                        <tr th:each="e : ${eventos}" th:attr="data-tipo=${e.tipoEvento}">
                            <td class="fecha-col" th:text="${e.fecha != null} ? ${#temporals.format(e.fecha, 'dd/MM/yyyy HH:mm:ss')} : '—'"></td>
                            <td class="fw-bold" th:text="${e.usuario} ?: '—'"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${e.tipoEvento == 'LOGIN'} ? 'bg-success' : (${e.tipoEvento == 'LOGIN_FALLIDO'} ? 'bg-danger' : (${e.tipoEvento == 'LOGOUT'} ? 'bg-secondary' : (${#strings.startsWith(e.tipoEvento, 'USUARIO')} ? 'bg-primary' : 'bg-dark')))"
                                      th:text="${e.tipoEvento}"></span>
                            </td>
                            <td class="text-muted" th:text="${e.detalle}"></td>
                            <td class="text-muted small" th:text="${e.ip} ?: '—'"></td>
                        </tr>
                        </tbody>
                    </table>
                    <div id="sinResultados" class="text-center text-muted py-5" style="display:none;">
                        No hay eventos que coincidan con la búsqueda.
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const rows = Array.from(document.querySelectorAll('#tbodyAud tr'));
        document.getElementById('totalEventos').textContent = rows.length;
        const buscador = document.getElementById('buscador');
        const filtro = document.getElementById('filtroTipo');
        const aviso = document.getElementById('sinResultados');

        function filtrar() {
            const q = buscador.value.toLowerCase().trim();
            const tipo = filtro.value;
            let vis = 0;
            rows.forEach(tr => {
                const okTxt = tr.textContent.toLowerCase().includes(q);
                const okTipo = !tipo || tr.getAttribute('data-tipo') === tipo;
                const ok = okTxt && okTipo;
                tr.style.display = ok ? '' : 'none';
                if (ok) vis++;
            });
            aviso.style.display = vis === 0 ? '' : 'none';
        }
        buscador.addEventListener('input', filtrar);
        filtro.addEventListener('change', filtrar);
    });
</script>
</body>
</html>
