<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LTOTRACE · Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-color: #1a1c1e;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }
        .brand {
            font-weight: 800;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
<div class="card login-card">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <h2 class="brand text-dark mb-1"><i class="bi bi-hdd-stack"></i> LTOTRACE</h2>
            <p class="text-muted small mb-0">Sistema de Trazabilidad LTO</p>
        </div>

        <!-- Mensaje de error -->
        <div th:if="${error}" class="alert alert-danger py-2 small" role="alert" th:text="${error}"></div>

        <!-- Aviso de cierre de sesión -->
        <div th:if="${param.logout}" class="alert alert-success py-2 small" role="alert">
            Sesión cerrada correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold small text-muted">USUARIO</label>
                <input type="text" name="username" class="form-control form-control-lg"
                       placeholder="usuario" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold small text-muted">CONTRASEÑA</label>
                <input type="password" name="password" class="form-control form-control-lg"
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
                <i class="bi bi-box-arrow-in-right"></i> Ingresar
            </button>
        </form>
    </div>
</div>
</body>
</html>
