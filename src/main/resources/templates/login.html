<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LTOTRACE · Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --lto-azul: #70a1bd;
            --lto-oscuro: #343734;
            --lto-claro: #eff1e8;
        }
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            /* Caja apoyada a la IZQUIERDA, sobre la franja azul */
            justify-content: flex-start;
            /* Filtro suave, la imagen ya tiene su propio tono */
            background:
                linear-gradient(rgba(52, 55, 52, 0.25), rgba(52, 55, 52, 0.25)),
                url('/img/fondo_login2.png') center center / cover no-repeat fixed;
        }
        .login-wrapper {
            /* Separación desde el borde izquierdo para caer sobre la franja azul */
            margin-left: 8vw;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            border: none;
            border-radius: 14px;
            background-color: rgba(239, 241, 232, 0.97);
            box-shadow: 0 12px 45px rgba(0, 0, 0, 0.35);
        }
        .brand { font-weight: 800; letter-spacing: 1px; color: var(--lto-oscuro); }
        .brand .accent { color: var(--lto-azul); }
        .form-label { color: var(--lto-oscuro); }
        .btn-lto {
            background-color: var(--lto-azul);
            border-color: var(--lto-azul);
            color: #fff;
        }
        .btn-lto:hover { background-color: #5f8fab; border-color: #5f8fab; color: #fff; }
        .form-control:focus {
            border-color: var(--lto-azul);
            box-shadow: 0 0 0 0.2rem rgba(112, 161, 189, 0.25);
        }

        /* En pantallas chicas, la caja se centra para que no quede pegada al borde */
        @media (max-width: 576px) {
            body { justify-content: center; }
            .login-wrapper { margin-left: 0; }
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="card login-card">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <h2 class="brand mb-1">LTO<span class="accent">TRACE</span></h2>
                <p class="text-muted small mb-0">Sistema de Trazabilidad LTO</p>
            </div>

            <!-- Mensaje de error -->
            <div th:if="${error}" class="alert alert-danger py-2 small" role="alert" th:text="${error}"></div>

            <!-- Aviso de sesión expirada -->
            <div th:if="${param.expirada}" class="alert alert-warning py-2 small" role="alert">
                Tu sesión expiró por inactividad. Iniciá sesión nuevamente.
            </div>

            <!-- Aviso de cuenta desactivada durante una sesión abierta -->
            <div th:if="${param.deshabilitado}" class="alert alert-danger py-2 small" role="alert">
                Tu cuenta fue desactivada. Contactá a un administrador.
            </div>

            <!-- Aviso de cierre de sesión -->
            <div th:if="${param.logout}" class="alert alert-success py-2 small" role="alert">
                Sesión cerrada correctamente.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold small">USUARIO</label>
                    <input type="text" name="username" class="form-control form-control-lg"
                           placeholder="usuario" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold small">CONTRASEÑA</label>
                    <input type="password" name="password" class="form-control form-control-lg"
                           placeholder="********" required>
                </div>
                <button type="submit" class="btn btn-lto btn-lg w-100 fw-bold">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
